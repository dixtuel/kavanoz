# /srv/mikoshi-vds/containers/docker-compose.yml içine eklenen servisler (cobalt-web'in
# "bind-mount + node:20-alpine" deseni — ayrı bir Dockerfile/build adımı yok).
# Bu dosya yalnız referans; asıl compose dosyası zaten güncellendi (canlıda).

  kavanoz:
    image: node:20-alpine
    container_name: kavanoz
    restart: unless-stopped
    working_dir: /app
    mem_limit: 96m
    memswap_limit: 192m
    ports:
      - "127.0.0.1:3030:3030"
    env_file:
      - /srv/mikoshi-vds/containers/kavanoz/.env
    volumes:
      - /srv/mikoshi-vds/containers/kavanoz:/app
    command: node server/server.js

  kavanoz-worker:
    image: node:20-alpine
    container_name: kavanoz-worker
    working_dir: /app
    mem_limit: 96m
    memswap_limit: 192m
    profiles: ["tools"]   # kendiliğinden ayağa kalkmaz, yalnız systemd timer `docker compose run --rm` ile tetikler
    env_file:
      - /srv/mikoshi-vds/containers/kavanoz/.env
    volumes:
      - /srv/mikoshi-vds/containers/kavanoz:/app
    command: node worker/send-due.js
